name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: acriland
          POSTGRES_PASSWORD: acriland
          POSTGRES_DB: acriland_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acriland -d acriland_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://acriland:acriland@localhost:5432/acriland_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-that-is-longer-than-32-characters
      CORS_ORIGIN: http://localhost:5173
      APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Build production Docker image
        run: docker build --tag acriland-fleet:ci .
