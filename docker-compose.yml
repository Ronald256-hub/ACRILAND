services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acriland
      POSTGRES_PASSWORD: acriland
      POSTGRES_DB: acriland
    ports:
      - "5432:5432"
    volumes:
      - acriland_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acriland -d acriland"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acriland_postgres:
